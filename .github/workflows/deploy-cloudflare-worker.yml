# Deploy the vinext Cloudflare Worker to the owner's Cloudflare account.
# This workflow does not publish GitHub Pages. There is no Pages artifact,
# no pages permission, and no static-site host. Production is a Worker.
name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Check public release content
        run: node scripts/check-release.mjs

      - name: Build Worker
        run: npm run build

      - name: Prepare production Wrangler config
        run: node scripts/prepare-workers-deploy.mjs

  deploy:
    name: Deploy Worker
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set the GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying. See MIGRATION.md."
            exit 1
          fi

      - name: Prepare production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_ATTACH_CUSTOM_DOMAINS: ${{ vars.CLOUDFLARE_ATTACH_CUSTOM_DOMAINS }}
        run: node scripts/prepare-workers-deploy.mjs

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.92.0"
          command: deploy --config dist/server/wrangler.production.json --no-bundle --no-x-autoconfig

      - name: Record Worker URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Worker URL"
            if [ -n "$DEPLOYMENT_URL" ]; then
              printf '%s\n' "$DEPLOYMENT_URL"
            else
              echo "Wrangler did not return a deployment URL. Check the deploy log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
